[project]
name = "lifesim"
version = "0.1.0"
description = "Text-driven life simulation game (Quality-Based Narrative)"
authors = [
    {name = "Shumpei Morimoto"}
]
readme = "README.md"
requires-python = ">=3.12"

# Provisional stack (mirrors SmartQ; STEP 5 may revise). No `openai` — LifeSim
# does no runtime LLM calls, and the project's hard rule bans OpenAI anyway.
# `websockets` is for the future multiplayer "並走する人生" crossing layer.
dependencies = [
    "fastapi>=0.116.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.35.0",
    # Not imported directly — uvicorn's WebSocket protocol backend.
    "websockets>=12.0",
]

[tool.ruff]
line-length = 100

# Dev tooling lives here (not optional-dependencies) so `uv run ruff/ty/pytest`
# resolve them without an extra `--extra dev` flag.
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.7",
    "ty>=0.0.1a25",
]
